<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bojana Estudio Portal de Clientes</title>
    <meta name="description" content="Plataforma de Dirección y Gerenciamiento de Obras" />
    <meta property="og:title" content="Bojana Estudio Portal de Clientes" />
    <meta property="og:description" content="Plataforma de Dirección y Gerenciamiento de Obras" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchFn = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;

          // Provide both getter and setter on window so scripts setting window.fetch never throw
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchFn;
            },
            set: function(newFetch) {
              fetchFn = newFetch;
            },
            configurable: true,
            enumerable: true
          });

          // Ensure Window.prototype has a matching setter if it only had a getter
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && protoDesc.configurable && !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return fetchFn;
                  },
                  set: function(newFetch) {
                    fetchFn = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }

          // Protect globalThis if present and distinct from window
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return fetchFn;
                },
                set: function(newFetch) {
                  fetchFn = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          console.warn('Fetch setter safeguard initialization:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
